name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    # Install exactly what uv.lock pins, like the Pi and Railway do. Unpinned
    # pip installs pulled pydantic 2.14 (lock: 2.12) and broke recipe review.
    - name: Install dependencies
      run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

    - name: Run pytest
      run: uv run --no-sync pytest backend/tests/ tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Lint with ruff
      run: |
        ruff check backend/ --output-format=github
      continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'  # @ai-sdk/gateway needs >=22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Type check frontend
      working-directory: frontend
      run: npm run check

    - name: Build frontend
      working-directory: frontend
      run: npm run build
