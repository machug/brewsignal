[project]
name = "brewsignal"
version = "2.13.0"
description = "Modern web UI for BrewSignal Hydrometer monitoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "bleak>=0.22",
    "beacontools>=2.1",
    "httpx>=0.25",
    "defusedxml>=0.7",
    "jsonschema>=4.20",
    "referencing>=0.30",
    "python-multipart>=0.0.6",
    # MQTT for Home Assistant
    "aiomqtt>=2.0.0",
    # ML dependencies
    "numpy>=1.24",
    "filterpy>=1.4.5",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "asyncpg>=0.31.0",
    # Auth dependencies
    "PyJWT>=2.8",
    "cryptography>=41.0",
    # AI assistant dependencies
    "tiktoken>=0.5",
    "python-dotenv>=1.0",
    "prompty>=0.1",
    "scalar-fastapi>=1.8.2",
    "pydantic-ai-slim[openrouter]==2.66.0",
    # Assistant long-term memory (embedded qdrant-client is a mem0ai dependency)
    "mem0ai==2.2.1",
    # mem0 pgvector store on hosted (pure-python psycopg + binary wheels incl. linux aarch64)
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
]
cloud = [
    # PostgreSQL async driver for cloud deployment
    "asyncpg>=0.29",
    # Supabase client for auth
    "supabase>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
